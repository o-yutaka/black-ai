name: ROGII Segment Selector

on:
  push:
    paths:
      - "competitions/rogii/**"
      - ".github/workflows/rogii-segment-selector.yml"
  pull_request:
    paths:
      - "competitions/rogii/**"
      - ".github/workflows/rogii-segment-selector.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=. pytest -q competitions/rogii/tests
